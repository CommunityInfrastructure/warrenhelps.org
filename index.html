<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warren Helps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; max-width: 600px; padding: 2rem; }
    h1 { font-size: 2.5rem; color: #fff; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .tagline { font-size: 1.1rem; color: #8892b0; margin-bottom: 2rem; }
    .status {
      display: inline-block; background: #16213e; border: 1px solid #2a3a5c;
      border-radius: 8px; padding: 1rem 2rem; font-size: 0.95rem; color: #64ffda;
    }
    .status span {
      display: inline-block; width: 8px; height: 8px; background: #64ffda;
      border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Warren Helps</h1>
    <p class="tagline">Warren County crisis response</p>
    <div class="status"><span></span> Coming soon</div>
  </div>
</body>
</html>
